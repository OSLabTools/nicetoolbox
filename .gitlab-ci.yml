# runs only on main and merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - test
  - publish

pre-commit-checks:
  stage: check
  tags:
    - docker
  image: python:3.10
  script:
    - pip install pre-commit
    - pre-commit run --all-files

unit-test:
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: recursive # repo and submodules
  tags:
    - shell
  script:
    # base build: unit tests run in the core venv only, no third-party detectors needed
    - bash scripts/build_docker.sh cicd true false base
    - docker run --rm mpioslab/nicetoolbox:cicd bash -c
      "source ./envs/nicetoolbox/bin/activate && pytest -v"

publish-apptainer:
  stage: publish
  when: manual
  variables:
    GIT_SUBMODULE_STRATEGY: recursive # repo and submodules
  tags:
    - shell
  script:
    - apptainer registry login -u 'robot$'${HARBOR_ROBOT_NAME} -p $HARBOR_ROBOT_TOKEN $HARBOR_URL
    - bash scripts/build_docker.sh cicd false true full # internal build: all detectors, include gated HF models
    - apptainer build nicetoolbox.sif docker-daemon://mpioslab/nicetoolbox:cicd
    - apptainer push nicetoolbox.sif ${HARBOR_URL}/oslab/nicetoolbox:${CI_COMMIT_SHORT_SHA}
  after_script:
    - apptainer registry logout $HARBOR_URL

publish-to-github:
  stage: publish
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - docker
  image: 
    name: alpine/git
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone # make sure to clone it again, if tags were updated
    GIT_DEPTH: 0 # Fetch full history
    GITHUB_URL: https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_USERNAME}/nicetoolbox.git
  script:
    - TAGS=$(git tag --points-at HEAD) 
    - TAG_COUNT=$(echo "$TAGS" | wc -l)
    - | # check that we have exactly one tag for this release
      if [ -z "$TAGS" ] || [ "$TAG_COUNT" -ne 1 ]; then
        echo "Error: Expected exactly 1 tag, found $TAGS"
        exit 1
      fi
    - git checkout main # we start with HEAD, so first checkout branch
    - git remote add github $GITHUB_URL
    - git push github main
    - git push github $TAGS --force # force push tags relevant to this commit

publish-to-dockerhub:
  stage: publish
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_STRATEGY: clone # make sure to clone it again, if tags were updated
    GIT_SUBMODULE_STRATEGY: recursive # clone repo and submodules
  tags:
    - shell
  script:
    - TAGS=$(git tag --points-at HEAD)
    - TAG_COUNT=$(echo "$TAGS" | wc -l)
    - | # check that we have exactly one tag for this release
      if [ -z "$TAGS" ] || [ "$TAG_COUNT" -ne 1 ]; then
        echo "Error: Expected exactly 1 tag, found $TAGS"
        exit 1
      fi
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
    # public build: core toolbox only. Third-party detectors are installed by the user,
    # so that we do not redistribute them under their own licenses.
    - bash scripts/build_docker.sh latest false false base
    - docker image tag mpioslab/nicetoolbox:latest mpioslab/${DOCKERHUB_REPO}:latest
    - docker image tag mpioslab/nicetoolbox:latest mpioslab/${DOCKERHUB_REPO}:$TAGS
    - docker image push mpioslab/${DOCKERHUB_REPO}:latest
    - docker image push mpioslab/${DOCKERHUB_REPO}:$TAGS
  after_script:
    - docker logout # we always try to logout, even if job failed