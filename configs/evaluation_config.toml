# This config supports using placeholders.
# options are <git_hash> <commit_message> <me> <today> <yyyymmdd> <time> <pwd>
# and all keys from your local 'machine_specific_paths.toml' or 'nice_project.toml':

log_level = "INFO"            # Options: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG"
log_file_path = "<output_folder>/evaluation.log"

# default experiment path (used when no other experiment specified)
default_experiment_name = "<yyyymmdd>"
default_experiment = "<output_folder_path>/experiments/<default_experiment_name>"
output_folder = "<default_experiment>_eval"

# path to other configs
predictions_mapping = "<configs_folder_path>/predictions_mapping.toml"

# ============================================================================================
# =                                     Metrics                                              =
# ============================================================================================

# Whitelist of metrics that will be executed. Write "*" to run all of them 
# or list ["bone_length", "bone_length_verbose"] to only run selected.
run_metrics = "*"

# ================================= Bone Length ==============================================
# This metric estimates how consistent 3d body joints bones across video recording are.
# Bones (connection between two body joints) are defined in predictions_mapping config.
# Metric assumes that bones should have constant distance and any deviation is a tracking error.

# This metric doesn't require any ground truth data.
# It produces .npz bone length per frame and two summary .csv reports.
# Check 'std' and 'cv' in summary report - lower is better.

# basic metric
[metrics.bone_length]
metric_type = "bone_length"
predictions = { component = "body_joints", npz_key = "3d" }  # use default experiment, override with path if needed
summary_group_by = ["subject", "sequence", "label"]
summary_aggr = ["min", "mean", "max", "std", "cv"]

# filter by two algorithms
[metrics.bone_length_hrnet_vs_vitpose]
metric_type = "bone_length"
predictions = { component = "body_joints", algorithm = ["hrnetw48", "vitpose_huge"], npz_key = "3d" }
summary_group_by = ["subject", "sequence", "label"]
summary_aggr = ["median", "std"]  # we can customize aggregation function

# compare local-space algorithms
[metrics.bone_length_local]
metric_type = "bone_length"
# we can declare input block with dot notation
predictions.component = "body_joints_local"
predictions.camera = "view_center"  # we take only view center predictions
predictions.npz_key = "3d"
# the rest of fields as normal
summary_group_by = ["subject", "sequence", "label"]
summary_aggr = ["min", "mean", "max", "std", "cv"]

# ================================= Missing Points ==============================================
# Counts missing joints per frame. Joint considered missing if coordinate contains nan
# or confidence below min_confidence threshold (optional)

# This metric doesn't require any ground truth data.
# It produces .npz of counted joints (number and percent) per frame and two summary .csv reports.
# Check detection rate as final score - higher is better. 

[metrics.missing_points_3d]
metric_type = "missing_points"
predictions = { component = "body_joints", npz_key = "3d" } 
missing_points_summary_group_by = []  # no group by - just give one number per algorithm
missing_points_summary_aggr = [
# we can assign custom names for aggregation functions  
#      column name            aggregation function
    { name = "total_count",    fn = "count" },           # total number of points
    { name = "miss_count",     fn = "sum" },             # all missing points
    { name = "detection_rate", fn = "one_minus_mean" }   # percentage of detected points (1 - missing rate)
]

# again 3d missing point, but very detailed group by
[metrics.missing_points_3d_verbose]
metric_type = "missing_points"
predictions = { component = "body_joints", npz_key = "3d" } 
missing_points_summary_group_by = "*"  # full group by - as detailed summary as possible
missing_points_summary_aggr = [{ name = "miss_rate", fn = "mean" }]

# 2d missing points with confidence threshold > 0.5
[metrics."missing_points_2d@0.5"]
metric_type = "missing_points"
predictions = { component = "body_joints", npz_key = "2d" } 
min_confidence = 0.5  # custom threshold of confidence per joint
missing_points_summary_group_by = "*"
missing_points_summary_aggr = [{ name = "miss_rate", fn = "mean" }]


# ================================= PCK (Percentage of Correct Keypoints) =======================
# Measures 2d keypoint accuracy against ground truth annotations.
# A keypoint is considered correct if exist (not-NaN) and within N pixels of the ground truth.

# This metric requires ground truth annotation data.
# It produces .npz of per-frame per-joint correctness flags and summary .csv reports.
# Check 'pck' in summary report - higher is better.

# strict threshold
[metrics."body_pck@10px"]
metric_type = "pck"
threshold = 10  # threshold in pixels
predictions = { component = "body_joints", npz_key = "2d_interpolated" }
ground_truth = { source = "annotation", component = "body_joints", npz_key = "2d" }
summary_group_by = ["label"]
summary_aggr = [
    { name = "pck",           fn = "mean"  },  # fraction of correct keypoints
    { name = "correct_count", fn = "sum"   },  # number of correct frames
    { name = "support",       fn = "count" },  # total evaluated frames
]

# loose threshold
[metrics."body_pck@25px"]
metric_type = "pck"
threshold = 25
predictions = { component = "body_joints", npz_key = "2d_interpolated" }
ground_truth = { source = "annotation", component = "body_joints", npz_key = "2d" }
summary_group_by = ["label"]
summary_aggr = [
    { name = "pck",           fn = "mean"  },  # fraction of correct keypoints
    { name = "correct_count", fn = "sum"   },  # number of correct frames
    { name = "support",       fn = "count" },  # total evaluated frames
]


# ================================= Confusion Matrix ============================================
# Computes binary confusion matrix (True Positive, False Negative, etc.) 
# with derived precision, recall, F1, accuracy.

# This metric requires ground truth annotation data.
# It produces summary .csv reports with per-group scores.
# Check 'f1', 'precision', 'recall' in summary report - higher is better.

[metrics.confusion_matrix_gaze_look_at_3d]
metric_type = "confusion_matrix"
predictions = { component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
compute_group_by = []

[metrics.confusion_matrix_gaze_look_at_2d]
metric_type = "confusion_matrix"
predictions = { component = "gaze_interaction", camera = "view_center", npz_key = "gaze_look_at_2d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
broadcast_single = true
compute_group_by = []

# ================================= ROC AUC =====================================================
# Computes ROC (Receiver Operating Characteristic) curve and Area Under Curve (AUC)
# score by varying decision thresholds (TPR vs FPR).
# Also derives the optimal threshold via Youden's J statistic (maximizes TPR - FPR).

# This metric requires ground truth annotation data.
# It produces summary .csv reports and roc_curves.png visualization.
# Check 'auc' in summary report - higher is better (1.0 perfect, 0.5 random).

[metrics.roc_auc_gaze_look_at_3d]
metric_type = "roc_auc"
predictions = { component = "gaze_interaction", npz_key = "distance_gaze_3d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
negate_scores = true  # larger distance = not looking, inverting scores
compute_group_by = []

[metrics.roc_auc_gaze_look_at_2d]
metric_type = "roc_auc"
predictions = { component = "gaze_interaction", camera = "view_center", npz_key = "distance_gaze_2d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
broadcast_single = true
negate_scores = true  # larger distance = not looking, inverting scores
compute_group_by = []

# ================================= PR Curve ====================================================
# Computes Precision-Recall curve and Average Precision (AP) score by varying decision thresholds.
# Also derives the optimal threshold by maximizing F1 across the curve.

# This metric requires ground truth annotation data.
# It produces summary .csv reports and pr_curves.png visualization.
# Check 'ap' in summary report - higher is better.

[metrics.pr_curve_gaze_look_at_3d]
metric_type = "pr_curve"
predictions = { component = "gaze_interaction", npz_key = "distance_gaze_3d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
negate_scores = true  # larger distance = not looking, inverting scores
compute_group_by = []

[metrics.pr_curve_gaze_look_at_2d]
metric_type = "pr_curve"
predictions = { component = "gaze_interaction", camera = "view_center", npz_key = "distance_gaze_2d" }
ground_truth = { source = "annotation", component = "gaze_interaction", npz_key = "gaze_look_at_3d" }
broadcast_single = true
negate_scores = true
compute_group_by = []

# ================================= Transcription Error Rate ====================================
# Word/Character Error Rate for audio transcription detectors.

# WER for whisperx
[metrics.whisperx_wer]
metric_type = "transcription_error_rate"
# input information about the metrics
subsequence = "communication_multiview_sequence_xyz_s0_l-1"
algorithm = "whisperx"
annotation_folder = "<datasets_folder_path>/communication_multiview/annotations"
predictions = { path = "<default_experiment>/<subsequence>/audio_transcription/<algorithm>.json", track = "room" }
ground_truth = { path = "<annotation_folder>/sequence_xyz_speaker_aligned_transcription.json", track = "room" }
# Additional parameters for text processing
remove_filler = true
lower_case = true
strip_punctuation = true
expand_contractions = true
normalize_numbers = true

# WER for crisper_whisper
[metrics.crisper_whisper_wer]
metric_type = "transcription_error_rate"
# input information about the metrics
subsequence = "communication_multiview_sequence_xyz_s0_l-1"
algorithm = "crisper_whisper"
annotation_folder = "<datasets_folder_path>/communication_multiview/annotations"
predictions = { path = "<default_experiment>/<subsequence>/audio_transcription/<algorithm>.json", track = "room" }
ground_truth = { path = "<annotation_folder>/sequence_xyz_speaker_aligned_transcription.json", track = "room" }
# Additional parameters for text processing
remove_filler = true
lower_case = true
strip_punctuation = true
expand_contractions = true
normalize_numbers = true
