# This config supports using placeholders.
# options are <git_hash> <commit_message> <me> <today> <yyyymmdd> <time> <pwd>
# and all keys from your local 'machine_specific_paths.toml' as well as 'io'
# and top layer dictionary entries

visualize = true              # whether to save image/video visualizations of detectors
skip_inference = false        # whether to skip native detectors inference and jump directly to post-processing/visualization
save_csv = true               # whether to save all results to csv-files
save_frames = false           # whether to save all frames with visualizations (if visualize is true)

error_level = "DETECTOR"      # Options: "DETECTOR", "SEQUENCE", "STRICT" (from least to most strict)
log_level = "INFO"            # Options: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG"

# checks that all detectors have their input dependencies enabled
check_missing_detectors_dependencies = true
# remove all gated (Hugging Face restricted-access) models from algorithms list, if no HF token exists
skip_gated_models_errors = true

# algorithms to run on the data
algorithms = [
   "video_subject_detector",                          # subjects identity system
   "rtmdet_m_person",                                 # person detection
   "rtmw_l_wholebody", "vitpose_huge",                # body keypoints (multi-camera 2d => 3d)
   "motionbert",                                      # lifted keypoints (single camera 2d => 3d)
   "velocity_body_2d", "velocity_body_3d",            # body velocity
   "body_distance_2d", "body_distance_3d",            # distance between subjects (per dimension)
   "sam_3d_body_dinov3",                              # 3d body mesh
   "eth_xgaze", "unigaze",                            # gaze direction
   "gaze_per_subject",                                # gaze directions fusion (select facial cameras)
   "gaze_distance_2d", "gaze_distance_3d",            # gaze interaction (for single camera and multi-camera)
   "spiga",                                           # head orientation
   "py_feat",                                         # emotions detection
   "whisperx", "crisper_whisper",                     # audio transcription
   "eye_closure_score_ear", "eye_state_ear",          # closed eyes detection (2d)
   "insight_face",                                    # face bounding box detection
   "mediapipe_face_landmarks",                        # MediaPipe face landmarks and blendshapes
]

# define which data to run on
# use sequence_id = "*" to run all sequences
[run]
[run.communication_multiview]
sequences = [
   {sequence_id = "sequence_xyz", video_start = 0, video_length = -1}  # Note: -1 for full video length
]

[io]
experiment_name = "<yyyymmdd>"                                     # define the name of the experiment (str), default: date as "<yyyymmdd>"
out_folder = "<output_folder_path>/experiments/<experiment_name>"  # define where to save the experiment output (str)
# Output folders based on the sequence (with sequence-level placeholders)
out_sub_folder_name = "<cur_dataset_name>_<cur_sequence_id>_s<cur_video_start>_l<cur_video_length>"
out_sub_folder = "<out_folder>/<out_sub_folder_name>"
csv_out_folder = "<out_sub_folder>/_csv_files"
# Preprocessed data input folder (extracted video frames, audio, etc.)
nicetoolbox_input_folder = "<output_folder_path>/nicetoolbox_input/<cur_dataset_name>_<cur_sequence_id>"
nicetoolbox_camera_input_folder = "<nicetoolbox_input_folder>/<cur_camera_name>"
# Code, assets and config file paths
code_folder = "<pwd>"
assets = "<code_folder>/nicetoolbox/detectors/assets"
asset_manifest = "<code_folder>/configs/asset_manifest.toml" # this config is in the NICE installation, not project!
dataset_properties = "<configs_folder_path>/dataset_properties.toml"
detectors_config = "<configs_folder_path>/detectors_config.toml"
predictions_mapping = "<configs_folder_path>/predictions_mapping.toml"
# Final results folder paths for all components and algorithms
detector_result_folder = "<out_sub_folder>/<cur_component_name>"
detector_visualization_folder = "<detector_result_folder>/<cur_algorithm_name>/visualization/"
# Paths for method detectors native output (from external environments)
detector_native_folder = "<out_sub_folder>/_native_outputs/<cur_algorithm_name>"
detector_native_out_folder = "<detector_native_folder>/detector_output"
detector_native_visualization_folder = "<detector_native_folder>/visualization"
detector_run_config_path = "<detector_native_folder>"

# Image format of frames extracted from videos
[io.frame_extraction]
frame_extension = ".jpg"     # Options: ".jpg", ".jpeg", ".png"
compression_quality = 2      # .jpg/.jpeg only: 1 to 31, lower means higher quality

# Alternatively, you can change frames format to png for losseless,
# but more space consumption and longer processing time
# frame_extension = ".png"
# compression_level = 2      # .png only: 0 to 9, higher means smaller files and slower extraction
