# This config supports the use of placeholders.
# options are, e.g., all keys from your local 'machine_specific_paths.toml'
#
# Each [algorithms.<instance_name>] block declares a named algorithm instance.
# The `algorithm_type` field selects the detector class; the TOML key is a
# user-defined instance name. The same algorithm_type can appear under
# multiple instance names (with different parameters) within one run.

# ======================================================================
#                           MMPose Body Joints
# ======================================================================

# generic templage for all 2d mmpose body joints algorithms 
# detects 2d points => triangulates 3d points from multiple cameras => post-processing
[templates.mmpose_2d_template]
algorithm_type = "mmpose_2d"  # name of the detector
camera_names = "*"  # cameras used in inference, "*" means all cameras
keypoint_mapping = "coco_wholebody"  # default body joitns mapping format
env_name = "conda:openmmlab"
device = "cuda:0"
# SGF filtering
filtered = true
window_length = 11
polyorder = 2
min_detection_confidence = 0.5
# visualization
visualize = true
save_detector_images = true
save_detector_predictions = true
# 3d triangulation
[templates.mmpose_2d_template.triangulation]
triangulate = true
triangulation_cameras = ["view_top", "view_center"] 

# HRNetW48 full body model
[algorithms.hrnetw48]
template = "mmpose_2d_template" 
components = ["body_joints", "hand_joints", "face_landmarks"]
pose_config = "td-hm_hrnet-w48_8xb32-210e_coco-wholebody-384x288"
[algorithms.hrnetw48.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/hrnet_w48_coco_wholebody_384x288_dark-f5726563_20200918.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# ViTPose large
[algorithms.vitpose_large]
template = "mmpose_2d_template"
components = ["body_joints"] 
pose_config = "td-hm_ViTPose-large_8xb64-210e_coco-256x192"
[algorithms.vitpose_large.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/td-hm_ViTPose-large_8xb64-210e_coco-256x192-53609f55_20230314.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# ViTPose huge (biggest model)
[algorithms.vitpose_huge]
template = "mmpose_2d_template"
components = ["body_joints"] 
pose_config = "td-hm_ViTPose-huge_8xb64-210e_coco-256x192"
[algorithms.vitpose_huge.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/td-hm_ViTPose-huge_8xb64-210e_coco-256x192-e32adcd4_20230314.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# RTMPose basic
# You can use multi-level inheritance for templates
[templates.rtmpose_l_aic_template]
template = "mmpose_2d_template"
components = ["body_joints"] 
pose_config = "rtmpose-l_8xb256-420e_aic-coco-384x288"
[templates.rtmpose_l_aic_template.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-l_8xb256-420e_aic-coco-384x288.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-l_simcc-aic-coco_pt-aic-coco_420e-384x288-97d6cb0f_20230228.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# very relaxed threshold for rtmppse
[algorithms.rtmpose_l_aic_low_conf]
template = "rtmpose_l_aic_template"
min_detection_confidence = 0.1

# strict threshold for rtmpose
[algorithms.rtmpose_l_aic_high_conf]
template = "rtmpose_l_aic_template"
min_detection_confidence = 0.5

# RTMPose full body
[algorithms.rtmpose_l_wholebody]
template = "mmpose_2d_template"
components = ["body_joints", "hand_joints", "face_landmarks"]
pose_config = "rtmpose-l_8xb32-270e_coco-ubody-wholebody-384x288"
[algorithms.rtmpose_l_wholebody.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-l_8xb32-270e_coco-ubody-wholebody-384x288.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-l_simcc-coco-wholebody_pt-aic-coco_270e-384x288-eaeb96c8_20230125.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# RTMPose MPII keypoints
[algorithms.rtmpose_m_mpii]
template = "mmpose_2d_template"
components = ["body_joints"]
pose_config = "rtmpose-m_8xb64-210e_mpii-256x256"
keypoint_mapping = "mpii"
[algorithms.rtmpose_m_mpii.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-m_8xb64-210e_mpii-256x256.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-m_simcc-mpii_pt-aic-coco_210e-256x256-ec4dbec8_20230206.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# ======================================================================
#                           MMPose MotionBERT
# ======================================================================

# generic template for MotionBERT
# existing 2d points => 3d points from single camera => post-processing
[templates.motionbert_template]
algorithm_type = "motionbert"
camera_names = ["view_top", "view_center"]
keypoint_mapping = "human36m"
env_name = "conda:openmmlab"
device = "cuda:0"
# SGF filtering
filtered = true
window_length = 11
polyorder = 2
min_detection_confidence = 0.5
# visualization
visualize = true
save_detector_images = true
save_detector_predictions = true
# motionbert models
[templates.motionbert_template.required_assets]
pose3d_config_file = "<assets>/mmpose/configs/motionbert_dstformer-243frm_8xb32-240e_h36m.py"
pose3d_checkpoint = "<assets>/mmpose/configs/motionbert_h36m-f554954f_20230531.pth"

# motionbert for vitpose
[algorithms.motionbert]
template = "motionbert_template"
input_detector_names = [["body_joints", "vitpose_huge"]]

# TODO: add motionbert support for other detectors

# ======================================================================
#                             SAM 3D Body
# ======================================================================

[algorithms.sam_3d_body]
algorithm_type = "sam_3d_body"
camera_names = ["view_top", "view_center"]
env_name = "venv:sam_3d_body"
device = "cuda:0"
visualize = true
# If empty, use the checkout cloned into the venv at envs/sam_3d_body/src/sam-3d-body
sam3d_repo_path = ""
detector_name = "vitdet"
segmentor_name = "sam2"
fov_name = "moge2"
inference_type = "body"
save_vertices = false
visualize_mesh = false
# Optional single-file 3D mesh viewer (Plotly HTML)
# visualize_mesh_interactive = true
# interactive_mesh_frame_stride = 5
# interactive_mesh_camera_index = 0
# interactive_mesh_prefer_world = true
# Omit interactive_mesh_subject_spacing for auto spacing.
# interactive_mesh_subject_spacing = 0
# interactive_mesh_line_width = 1
# interactive_mesh_max_edges = 12000
# interactive_mesh_max_frames = 48
# interactive_mesh_plotlyjs_cdn = true
bbox_sort_left_to_right = true
temporal_smooth = true
smooth_window_length = 7
smooth_polyorder = 2
world_align_keypoints_3d = true
cross_view_consistency = true
triangulation_min_detection_confidence = 0.6
keypoint_mapping = "sam_3d_body_mhr"
# 3d triangulation (back to world space)
[algorithms.sam_3d_body.triangulation]
triangulate = true
triangulation_cameras = ["view_top", "view_center"]  # cameras that will be used for 3d triangulation

[algorithms.sam_3d_body.required_assets]
sam_3d_body_model = "<assets>/sam_3d_body/models--facebook--sam-3d-body-dinov3"
sam2_model = "<assets>/sam_3d_body/models--facebook--sam2-hiera-large"
moge2_model = "<assets>/sam_3d_body/models--Ruicheng--moge-2-vitl-normal"

# ======================================================================
#                          Kinematics (Body Velocity)
# ======================================================================

# calculate subjects body joints velocity in pixels (inaccurate and non-normalized)
[algorithms.velocity_body_2d]
algorithm_type = "velocity_body_2d"
visualize = true
[algorithms.velocity_body_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "2d_filtered" }

# calculate subjects body joints velocity in world units (usually meters per second)
[algorithms.velocity_body_3d]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_3d.inputs]
pose_3d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "3d" }

# calculate subjects body joints velocity from motionbert uplifted body joints
# data is too noisy for practical usage (unstable global position)
[algorithms.velocity_body_motiobert_local]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_motiobert_local.inputs]
pose_3d = { component = "body_joints_local", algorithm = "motionbert", npz_key = "3d" }

# sam3d can directly predict 3d body joints from single camera view
[algorithms.velocity_body_sam3d_local]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_sam3d_local.inputs]
pose_3d = { component = "body_joints_local", algorithm = "sam_3d_body", npz_key = "3d" }

# ======================================================================
#                          Proximity (Body Distance)
# ======================================================================

# distance between subjects in pixels
[algorithms.body_distance_2d]
algorithm_type = "body_distance_2d"
used_keypoints = ["nose"]  # if the list is more than one keypoint, the midpoint
visualize = true
[algorithms.body_distance_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "hrnetw48", npz_key = "2d_filtered" }

# distance between subjects in world units (usually meters per second)
[algorithms.body_distance_3d]
algorithm_type = "body_distance_3d"
used_keypoints = ["nose"]
visualize = true
[algorithms.body_distance_3d.inputs]
pose_3d = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }

# ======================================================================
#                               ETH XGaze 
# ======================================================================

# ETH XGaze for 3d gaze vector detection
[algorithms.eth_xgaze]
algorithm_type = "eth_xgaze"
camera_names = "*"
env_name = "venv:eth_xgaze"
filtered = true
window_length = 11
polyorder = 2
visualize = true
visualize_native = false  # if true, inference subprocess also writes per-frame debug overlays
face_alignment_cache_dir = "<assets>/face_alignment"
[algorithms.eth_xgaze.required_assets]
face_model_filename = "<assets>/eth_xgaze/face_model.txt"
pretrained_model_filename = "<assets>/eth_xgaze/epoch_24_ckpt.pth.tar"
face_alignment_detector = "<assets>/face_alignment/hub/checkpoints/s3fd-619a316812.pth"
face_alignment_landmarks = "<assets>/face_alignment/hub/checkpoints/2DFAN4-cd938726ad.zip"


# ======================================================================
#                               Gaze Fusion
# ======================================================================

# transform individual view-by-view gaze predictions into one vector per subject
[templates.gaze_fusion]
algorithm_type = "gaze_fusion"
visualize = true
# closed eyes filtering
closed_eye_filter_mode = "none"
# filtering
filtered = true
window_length = 11
polyorder = 2
[templates.gaze_fusion.inputs]
gaze_per_camera_3d = { component = "gaze_individual", algorithm = "eth_xgaze", npz_key = "gaze_3d_filtered" }
gaze_origin_2d     = { component = "gaze_individual", algorithm = "eth_xgaze", npz_key = "gaze_origin_2d" }
eye_closed_state   = { component = "eye_closed_state", algorithm = "eye_state_ear", npz_key = "global_state" }

# average multiple 3d gaze vectors across cameras (weighted by confidence)
[algorithms.gaze_fusion_weighted]
template = "gaze_fusion"
fusion_method = "weighted_average"

# average multiple 3d gaze vectors across cameras (weighted by confidence) and interpolate closed-eye gaps
[algorithms.gaze_fusion_weighted_closed_eyes_interp]
template = "gaze_fusion"
fusion_method = "weighted_average"
closed_eye_filter_mode = "interpolate"

# average multiple 3d gaze vectors across cameras (weighted by confidence) and mark closed-eye gaps as nan
[algorithms.gaze_fusion_weighted_closed_eyes_nan]
template = "gaze_fusion"
fusion_method = "weighted_average"
closed_eye_filter_mode = "nan"

# select individual camera based predictions, discard others
[algorithms.gaze_fusion_per_subject]
template = "gaze_fusion"
fusion_method = "select_view"
subject_view_map = {person_left = "view_left", person_right = "view_right"}
filtered = false  # data is already filtered, no need to filter it again

# take only central view, both subjects visible, discard others
[algorithms.gaze_fusion_only_center]
template = "gaze_fusion"
fusion_method = "select_view"
subject_view_map = {person_left = "view_center", person_right = "view_center"}
filtered = false  # data is already filtered, no need to filter it again

# ======================================================================
#                           Gaze Interaction
# ======================================================================

# detect that subject gaze is towards another subject in 2d
[algorithms.gaze_distance_2d]
algorithm_type = "gaze_distance_2d"
used_keypoints = ["nose"]  # mean of these body joints
threshold_look_at = 130  # in pixels
visualize = true
[algorithms.gaze_distance_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "hrnetw48", npz_key = "2d_filtered" }
gaze_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted", npz_key = "gaze_2d_filtered" }

# same, but do it using scene 3d
[algorithms.gaze_distance_3d]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]   # mean of these body joints
threshold_look_at = 0.4  # in absolute units (meters)
visualize = true
[algorithms.gaze_distance_3d.inputs]
pose_3d        = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted", npz_key = "gaze_3d_filtered" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted", npz_key = "gaze_2d_filtered" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted", npz_key = "gaze_origin_2d" }

# gaze distance in 3D using the eye-closed interpolated gaze fusion output
[algorithms.gaze_distance_3d_closed_eyes_interp]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]
threshold_look_at = 0.4
visualize = true
[algorithms.gaze_distance_3d_closed_eyes_interp.inputs]
pose_3d        = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_interp", npz_key = "gaze_3d_filtered" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_interp", npz_key = "gaze_2d_filtered" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_interp", npz_key = "gaze_origin_2d" }

# gaze distance in 3D using the eye-closed interpolated gaze fusion output
[algorithms.gaze_distance_3d_closed_eyes_nan]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]
threshold_look_at = 0.4
visualize = true
[algorithms.gaze_distance_3d_closed_eyes_nan.inputs]
pose_3d        = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_nan", npz_key = "gaze_3d_filtered" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_nan", npz_key = "gaze_2d_filtered" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_weighted_closed_eyes_nan", npz_key = "gaze_origin_2d" }

# in scene 3d, but use gaze_fusion_per_subject
[algorithms.gaze_distance_3d_per_subject]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]   # mean of these body joints
threshold_look_at = 0.4  # in absolute units (meters)
visualize = true
[algorithms.gaze_distance_3d_per_subject.inputs]
pose_3d        = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_fusion_per_subject", npz_key = "gaze_3d" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_fusion_per_subject", npz_key = "gaze_2d" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_per_subject", npz_key = "gaze_origin_2d" }

# in scene 3d, but use gaze_fusion_per_subject
[algorithms.gaze_distance_3d_only_center]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]   # mean of these body joints
threshold_look_at = 0.4  # in absolute units (meters)
visualize = true
[algorithms.gaze_distance_3d_only_center.inputs]
pose_3d        = { component = "body_joints", algorithm = "hrnetw48", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_fusion_only_center", npz_key = "gaze_3d" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_fusion_only_center", npz_key = "gaze_2d" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_fusion_only_center", npz_key = "gaze_origin_2d" }


# ======================================================================
#                              InsightFace
# ======================================================================

# face detection model + five keypoints for face
[algorithms.insight_face]
algorithm_type = "insight_face"
env_name = "venv:insight_face"
camera_names = "*"
# visualization settings
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"  # can be "2d", "2d_filtered", "2d_interpolated" or "2d_reprojected_from_3d"
# model selection
model_pack = "buffalo_l"  # can be buffalo_l, buffalo_m, buffalo_s, buffalo_sc, antelopev2 
model_root = "<assets>/insight_face"
# post processing settings
det_thresh = 0.5  # minimum face detection and keypoints confidence
# SVG filter
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2 }
# fill short detection dropouts (linear)
interpolate_keypoints = {interpolated = true, max_gap = 10 }
# triangulate to 3d
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}  
[algorithms.insight_face.required_assets]
model_pack_path = "<assets>/insight_face/models/<model_pack>"


# ======================================================================
#                                SPIGA
# ======================================================================

# head_orientation + facial landmarks
[algorithms.spiga]
algorithm_type = "spiga"
env_name = "venv:spiga"
camera_names = "*"
keypoint_mapping = "wflw"
batch_size = 32
# visualization
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"  # can be "2d", "2d_filtered", "2d_interpolated" or "2d_reprojected_from_3d"
# post processing settings
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2 }
interpolate_keypoints = {interpolated = true, max_gap = 10 }
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}
[algorithms.spiga.inputs]
face_bbox_2d = { component = "face_bounding_box", algorithm = "insight_face", npz_key = "bbox_2d" }
[algorithms.spiga.required_assets]
model_weights_path = "<assets>/spiga/spiga_wflw.pt" # path to weights folder


# ======================================================================
#                        Emotions Detection Py-Feat
# ======================================================================

# emotion_individual
[algorithms.py_feat]
algorithm_type = "py_feat"
camera_names = ["view_left", "view_right"]
env_name = "venv:py_feat"
log_frame_idx_interval = 200
# For batch_size, ensure:
# [(batch_size) * (~Size of one frame (GB))] < Available vRAM (RAM) (GB)
batch_size = 512
visualize = true

# ======================================================================
#                      Audio Transcription WhisperX
# ======================================================================

[algorithms.whisperx]
algorithm_type = "whisperx"
track_names = "*"
fallback_camera = "view_center"
env_name = "venv:whisperx"
model_size = "large-v3"
compute_type = "float16"
batch_size = 16
language = "en"
vad_onset = 0.9
vad_offset = 0.9
alignment_model_name = "WAV2VEC2_ASR_LARGE_LV60K_960H"
visualize = true
# Hugging Face / WhisperX model cache root (directory created at inference if missing).
hf_weights_cache_dir = "<assets>/whisperx"

[algorithms.whisperx.required_assets]
faster_whisper = "<assets>/whisperx/models--Systran--faster-whisper-large-v3"
pyannote_diarization = "<assets>/whisperx/models--pyannote--speaker-diarization-community-1"
alignment_model = "<assets>/whisperx/hub/checkpoints/wav2vec2_fairseq_large_lv60k_asr_ls960.pth"


[algorithms.crisper_whisper]
algorithm_type = "crisper_whisper"
track_names = "*"
fallback_camera = "view_center"
env_name = "venv:crisper_whisper"
batch_size = 1
chunk_length_s = 30
stride_length_s = 5
visualize = true
hf_weights_cache_dir = "<assets>/crisper_whisper"

[algorithms.crisper_whisper.required_assets]
crisper_whisper = "<assets>/crisper_whisper/models--nyrahealth--CrisperWhisper"

# ======================================================================
#                      Eye Closure Detection (2D)
# ======================================================================

# detects how much subject closed their eyes using 2d facial landmarks
[algorithms.eye_closure_score_ear]
algorithm_type = "eye_closure_ear"
camera_names = ["view_left", "view_right"]  # use only face cameras
visualize = true
[algorithms.eye_closure_score_ear.inputs]
landmarks_2d = { component = "face_landmarks", algorithm = "spiga", npz_key = "2d" }

# same, but using mmpose 2d landmarks
[algorithms.eye_closure_score_ear_rtmpose]
algorithm_type = "eye_closure_ear"
camera_names = ["view_left", "view_right"]  # use only face cameras
visualize = true
[algorithms.eye_closure_score_ear_rtmpose.inputs]
landmarks_2d = { component = "face_landmarks", algorithm = "rtmpose_l_wholebody", npz_key = "2d" }

# define that eye closed if aspect ration is less than threshold
[algorithms.eye_state_ear]
algorithm_type = "eye_closure_threshold"
camera_names = ["view_right", "view_left"]
visualize = true
threshold = 0.22  # max ratio for closed eye
[algorithms.eye_state_ear.inputs]
score = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "score" }
eye_landmarks_2d = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "eye_landmarks_2d" }

# calculate blinks
[algorithms.eye_blinks_state_ear]
algorithm_type = "eye_closure_threshold"
camera_names = ["view_right", "view_left"]
visualize = true
threshold = 0.22
# define min and max time for eye to be considered blinked
min_duration = 0.05
max_duration = 0.5
