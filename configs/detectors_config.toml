# This config supports the use of placeholders.
# options are, e.g., all keys from your local machine_specific_paths.toml
#
# Each [algorithms.<instance_name>] block declares a named algorithm instance.
# The algorithm_type field selects the detector class; the TOML key is a
# user-defined instance name. The same algorithm_type can appear under
# multiple instance names (with different parameters) within one run.

# ======================================================================
#                      MMDet Person Bounding Box
# ======================================================================

# generic template for person detector
[templates.mmdet_template]
algorithm_type = "mmdet"
env_name = "openmmlab"
camera_names = "*"
# infernece settings
batch_size = 32
# post-processing settings
det_thresh = 0.5  # discard bbox if lower than threshold
iou_thresh = 0.8  # discard bbox if it intersects with any other subject
# visualization
visualize = true
visualize_native = false
save_raw_json_predictions = false  # native mmdet serialization to json (for debug)
[templates.mmdet_template.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }

# commonly used baseline for object detection
[algorithms.faster_rcnn_person]
template = "mmdet_template"
detection_model_config = "faster-rcnn_r50_fpn_1x_coco"
[algorithms.faster_rcnn_person.required_assets]
det_checkpoint = "<assets>/mmdet/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

# YOLOX-small - fast modern alternative
[algorithms.yolox_s_person]
template = "mmdet_template"
detection_model_config = "yolox_s_8x8_300e_coco"
[algorithms.yolox_s_person.required_assets]
det_checkpoint = "<assets>/mmdet/yolox_s_8x8_300e_coco_20211121_095711-4592a793.pth"

# RTMDet-medium (only person detection fine-tuned weights)
[algorithms.rtmdet_m_person]
template = "mmdet_template"
[algorithms.rtmdet_m_person.required_assets]
det_config = "<assets>/mmdet/configs/rtmdet_m_640-8xb32_coco-person.py"
det_checkpoint = "<assets>/mmdet/rtmdet_m_8xb32-100e_coco-obj365-person-235e8209.pth"

# ======================================================================
#                           MMPose Body Joints
# ======================================================================

# generic template for the standalone mmpose 2D pose detector
# detects 2d points => triangulates 3d points from multiple cameras => post-processing
[templates.mmpose_2d_template]
algorithm_type = "mmpose_2d"  # name of the detector
env_name = "openmmlab"
camera_names = "*"  # cameras used in inference, "*" means all cameras
keypoint_mapping = "coco_wholebody"  # default body joitns mapping format
# inference settings
decode_visibility = false  # try to decode "visibility" [0, 1] score (available for some models)
# visualization
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"  # "2d", "2d_filtered", "2d_masked", "2d_interpolated", or "2d_reprojected_from_3d"
save_raw_json_predictions = false  # native mmpose serialization to json (for debug)
# post-processing
min_detection_confidence = 0.5  # discard keypoints with low confidence
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2} 
interpolate_keypoints = {interpolated = true, max_gap = 10}
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}
# inputs from other detectors
[templates.mmpose_2d_template.inputs]
person_bboxes = { component = "person_bounding_box", algorithm = "rtmdet_m_person", npz_key = "bbox_2d" }

# HRNetW48 full body model
[algorithms.hrnetw48]
template = "mmpose_2d_template"
components = ["body_joints", "hand_joints", "face_landmarks"]
pose_config = "td-hm_hrnet-w48_dark-8xb32-210e_coco-wholebody-384x288"
[algorithms.hrnetw48.required_assets]
pose_checkpoint = "<assets>/mmpose/hrnet_w48_coco_wholebody_384x288_dark-f5726563_20200918.pth"

# ViTPose large
[algorithms.vitpose_large]
template = "mmpose_2d_template"
components = ["body_joints"]
pose_config = "td-hm_ViTPose-large_8xb64-210e_coco-256x192"
[algorithms.vitpose_large.required_assets]
pose_checkpoint = "<assets>/mmpose/td-hm_ViTPose-large_8xb64-210e_coco-256x192-53609f55_20230314.pth"

# ViTPose huge (biggest model)
[algorithms.vitpose_huge]
template = "mmpose_2d_template"
components = ["body_joints"]
pose_config = "td-hm_ViTPose-huge_8xb64-210e_coco-256x192"
[algorithms.vitpose_huge.required_assets]
pose_checkpoint = "<assets>/mmpose/td-hm_ViTPose-huge_8xb64-210e_coco-256x192-e32adcd4_20230314.pth"

# RTMPose body-only, coco-aic keypoints
[algorithms.rtmpose_l_aic]
template = "mmpose_2d_template"
components = ["body_joints"]
pose_config = "rtmpose-l_8xb256-420e_aic-coco-384x288"
[algorithms.rtmpose_l_aic.required_assets]
pose_checkpoint = "<assets>/mmpose/rtmpose-l_simcc-aic-coco_pt-aic-coco_420e-384x288-97d6cb0f_20230228.pth"

# RTMPose full body (body + hand + face)
[algorithms.rtmpose_l_wholebody]
template = "mmpose_2d_template"
components = ["body_joints", "hand_joints", "face_landmarks"]
pose_config = "rtmpose-l_8xb32-270e_coco-wholebody-384x288"
min_detection_confidence = 0.2  # less restrictive threshold for confidence
[algorithms.rtmpose_l_wholebody.required_assets]
pose_checkpoint = "<assets>/mmpose/rtmpose-l_simcc-coco-wholebody_pt-aic-coco_270e-384x288-eaeb96c8_20230125.pth"

# RTMW-l full body (body + hand + face)
[algorithms.rtmw_l_wholebody]
template = "mmpose_2d_template"
components = ["body_joints", "hand_joints", "face_landmarks"]
pose_config = "rtmw-l_8xb320-270e_cocktail14-384x288"
decode_visibility = true
min_detection_confidence = 0.5
[algorithms.rtmw_l_wholebody.required_assets]
pose_checkpoint = "<assets>/mmpose/rtmw-dw-x-l_simcc-cocktail14_270e-384x288-20231122.pth"

# RTMPose MPII keypoints
[algorithms.rtmpose_m_mpii]
template = "mmpose_2d_template"
components = ["body_joints"]
keypoint_mapping = "mpii"
pose_config = "rtmpose-m_8xb64-210e_mpii-256x256"
[algorithms.rtmpose_m_mpii.required_assets]
pose_checkpoint = "<assets>/mmpose/rtmpose-m_simcc-mpii_pt-aic-coco_210e-256x256-ec4dbec8_20230206.pth"

# ======================================================================
#                       MMPose 3D Lifter (MotionBERT)
# ======================================================================

# MotionBERT 3D lift
# consumes an existing body_joints 2D NPZ => lifts to 3D per camera
[algorithms.motionbert]
algorithm_type = "mmpose_lifter_3d"
env_name = "openmmlab"
camera_names = ["view_center", "view_top"]
keypoint_mapping = "human36m"
pose_config = "motionbert_dstformer-ft-243frm_8xb32-120e_h36m"
# visualization
visualize = true
visualize_native = false
# inputs from other detectors
[algorithms.motionbert.inputs]
pose_2d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "2d_interpolated" }
person_bboxes = { component = "person_bounding_box", algorithm = "rtmdet_m_person", npz_key = "bbox_2d" }
[algorithms.motionbert.required_assets]
pose_checkpoint = "<assets>/mmpose/motionbert_ft_h36m-d80af323_20230531.pth"

# ======================================================================
#                             SAM 3D Body
# ======================================================================

# generic template for SAM 3D Body
[templates.sam_3d_body_template]
algorithm_type = "sam_3d_body"
env_name = "sam_3d_body"
camera_names = "*"
keypoint_mapping = "sam_3d_body_mhr"
# inference settings
cache_dir = "<assets>/sam_3d_body"
inference_type = "body"  # "body" or "full"
save_vertices = false  # use only for short sequences - space and RAM expensive
# post-processing
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2}
interpolate_keypoints = {interpolated = true, max_gap = 10}
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}
# visualization
visualize = true
visualize_keypoints_npz_key = "2d_interpolated"  # "2d", "2d_filtered", "2d_interpolated" or "2d_reprojected_from_3d"
visualize_native_2d = false  # native 2d skeleton visualization
visualize_native_3d = false  # native 3d mesh render
# inputs from other detectors
[templates.sam_3d_body_template.inputs]
person_bboxes = { component = "person_bounding_box", algorithm = "rtmdet_m_person", npz_key = "bbox_2d" }

# DINOv3-H+ image encoder
[algorithms.sam_3d_body_dinov3]
template = "sam_3d_body_template"
hf_repo_id = "facebook/sam-3d-body-dinov3"
[algorithms.sam_3d_body_dinov3.required_assets]
sam_3d_body_model = "<assets>/sam_3d_body/models--facebook--sam-3d-body-dinov3"
dinov3_code = "<assets>/sam_3d_body/hub/facebookresearch_dinov3_main"

# ViT-H image encoder
[algorithms.sam_3d_body_vith]
template = "sam_3d_body_template"
hf_repo_id = "facebook/sam-3d-body-vith"
[algorithms.sam_3d_body_vith.required_assets]
sam_3d_body_model = "<assets>/sam_3d_body/models--facebook--sam-3d-body-vith"

# ======================================================================
#                          Kinematics (Body Velocity)
# ======================================================================

# calculate subjects body joints velocity in pixels (inaccurate and non-normalized)
[algorithms.velocity_body_2d]
algorithm_type = "velocity_body_2d"
visualize = true
[algorithms.velocity_body_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "2d_filtered" }

# calculate subjects body joints velocity in world units (usually meters per second)
[algorithms.velocity_body_3d]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_3d.inputs]
pose_3d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "3d" }

# calculate subjects body joints velocity from motionbert uplifted body joints
# data is too noisy for practical usage (unstable global position)
[algorithms.velocity_body_motiobert_local]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_motiobert_local.inputs]
pose_3d = { component = "body_joints_local", algorithm = "motionbert", npz_key = "3d" }

# sam3d can directly predict 3d body joints from single camera view
[algorithms.velocity_body_sam_3d_local]
algorithm_type = "velocity_body_3d"
visualize = true
[algorithms.velocity_body_sam_3d_local.inputs]
pose_3d = { component = "body_joints_local", algorithm = "sam_3d_body_dinov3", npz_key = "3d_interpolated" }

# ======================================================================
#                          Proximity (Body Distance)
# ======================================================================

# distance between subjects in pixels
[algorithms.body_distance_2d]
algorithm_type = "body_distance_2d"
used_keypoints = ["nose"]  # if the list is more than one keypoint, the midpoint
visualize = true
[algorithms.body_distance_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "2d_filtered" }

# distance between subjects in world units (usually meters per second)
[algorithms.body_distance_3d]
algorithm_type = "body_distance_3d"
used_keypoints = ["nose"]
visualize = true
[algorithms.body_distance_3d.inputs]
pose_3d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "3d" }

# ======================================================================
#                               ETH XGaze 
# ======================================================================

# ETH XGaze for 3d gaze vector detection
[algorithms.eth_xgaze]
algorithm_type = "eth_xgaze"
camera_names = "*"
env_name = "eth_xgaze"
filtered = true
window_length = 11
polyorder = 2
visualize = true
visualize_native = false  # if true, inference subprocess also writes per-frame debug overlays
face_alignment_cache_dir = "<assets>/face_alignment"
[algorithms.eth_xgaze.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }
[algorithms.eth_xgaze.required_assets]
face_model_filename = "<assets>/eth_xgaze/face_model.txt"
pretrained_model_filename = "<assets>/eth_xgaze/epoch_24_ckpt.pth.tar"
face_alignment_detector = "<assets>/face_alignment/hub/checkpoints/s3fd-619a316812.pth"
face_alignment_landmarks = "<assets>/face_alignment/hub/checkpoints/2DFAN4-cd938726ad.zip"


# ======================================================================
#                               UniGaze
# ======================================================================

# UniGaze for appearance-based 3d gaze vector detection
[algorithms.unigaze]
algorithm_type = "unigaze"
camera_names = "*"
env_name = "unigaze"
filtered = false  # TODO: filtering is too aggressive with NaNs, disabled it
window_length = 11
polyorder = 2
visualize = true
visualize_native = false  # if true, inference subprocess also writes per-frame debug overlays
face_alignment_cache_dir = "<assets>/face_alignment"
[algorithms.unigaze.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }
[algorithms.unigaze.required_assets]
face_alignment_detector = "<assets>/face_alignment/hub/checkpoints/s3fd-619a316812.pth"
face_alignment_landmarks = "<assets>/face_alignment/hub/checkpoints/2DFAN4-cd938726ad.zip"
unigaze_model = "<assets>/unigaze/unigaze_h14_joint.safetensors"


# ======================================================================
#                               Gaze Fusion
# ======================================================================

# transform individual view-by-view gaze predictions into one vector per subject
[templates.gaze_fusion]
algorithm_type = "gaze_fusion"
visualize = true
filtered = false  # TODO: filtering is too aggressive with NaNs, disabled it
window_length = 11
polyorder = 2
[templates.gaze_fusion.inputs]
gaze_per_camera_3d = { component = "gaze_individual", algorithm = "unigaze", npz_key = "gaze_3d" }
gaze_origin_2d     = { component = "gaze_individual", algorithm = "unigaze", npz_key = "gaze_origin_2d" }

# average multiple 3d gaze vectors across cameras (weighted by confidence)
[algorithms.gaze_weighted]
template = "gaze_fusion"
fusion_method = "weighted_average"

# select individual camera based predictions, discard others
[algorithms.gaze_per_subject]
template = "gaze_fusion"
fusion_method = "select_view"
subject_view_map = {person_left = "view_left", person_right = "view_right"}

# take only central view where both subjects are visible, discard others
[algorithms.gaze_only_center]
template = "gaze_fusion"
fusion_method = "select_view"
subject_view_map = {person_left = "view_center", person_right = "view_center"}

# additional filtering by closed eyes
[algorithms.gaze_weighted_closed_eyes]
template = "gaze_fusion"
fusion_method = "weighted_average"
closed_eye_filter_mode = "interpolate"  # can be "none", "nan" and "interpolate"
closed_eye_max_interpolate_gap = 10
[algorithms.gaze_weighted_closed_eyes.inputs]
gaze_per_camera_3d = { component = "gaze_individual", algorithm = "unigaze", npz_key = "gaze_3d" }
gaze_origin_2d     = { component = "gaze_individual", algorithm = "unigaze", npz_key = "gaze_origin_2d" }
eye_closed_state   = { component = "eye_closed_state", algorithm = "eye_state_ear", npz_key = "global_state" }


# ======================================================================
#                           Gaze Interaction
# ======================================================================

# detect that subject gaze is towards another subject in 2d
[algorithms.gaze_distance_2d]
algorithm_type = "gaze_distance_2d"
used_keypoints = ["nose"]  # mean of these body joints
threshold_look_at = 130  # in pixels
visualize = true
[algorithms.gaze_distance_2d.inputs]
pose_2d = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "2d_filtered" }
gaze_2d = { component = "gaze_multiview", algorithm = "gaze_per_subject", npz_key = "gaze_2d" }

# same, but do it using scene 3d
[algorithms.gaze_distance_3d]
algorithm_type = "gaze_distance_3d"
used_keypoints = ["nose"]   # mean of these body joints
threshold_look_at = 0.4  # in absolute units (meters)
visualize = true
[algorithms.gaze_distance_3d.inputs]
pose_3d        = { component = "body_joints", algorithm = "vitpose_huge", npz_key = "3d" }
gaze_3d        = { component = "gaze_multiview", algorithm = "gaze_per_subject", npz_key = "gaze_3d" }
gaze_2d        = { component = "gaze_multiview", algorithm = "gaze_per_subject", npz_key = "gaze_2d" }
gaze_origin_2d = { component = "gaze_multiview", algorithm = "gaze_per_subject", npz_key = "gaze_origin_2d" }


# ======================================================================
#                              InsightFace
# ======================================================================

# face detection model + five keypoints for face
[algorithms.insight_face]
algorithm_type = "insight_face"
env_name = "insight_face"
camera_names = "*"
# visualization settings
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"  # can be "2d", "2d_filtered", "2d_interpolated" or "2d_reprojected_from_3d"
# model selection
model_pack = "buffalo_l"  # can be buffalo_l, buffalo_m, buffalo_s, buffalo_sc, antelopev2 
model_root = "<assets>/insight_face"
# post processing settings
det_thresh = 0.5  # minimum face detection and keypoints confidence
det_size = [[128, 128], [640, 640]]  # face detection resolutions passes
# SVG filter
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2 }
# fill short detection dropouts (linear)
interpolate_keypoints = {interpolated = true, max_gap = 10 }
# triangulate to 3d
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}
[algorithms.insight_face.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }
[algorithms.insight_face.required_assets]
model_pack_path = "<assets>/insight_face/models/<model_pack>"


# ======================================================================
#                                SPIGA
# ======================================================================

# head_orientation + facial landmarks
[algorithms.spiga]
algorithm_type = "spiga"
env_name = "spiga"
camera_names = "*"
keypoint_mapping = "wflw"
batch_size = 32
# visualization
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"  # can be "2d", "2d_filtered", "2d_interpolated" or "2d_reprojected_from_3d"
# post processing settings
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2 }
interpolate_keypoints = {interpolated = true, max_gap = 10 }
triangulate_keypoints = {triangulate = true, triangulation_cameras = ["view_top", "view_center"]}
[algorithms.spiga.inputs]
face_bbox_2d = { component = "face_bounding_box", algorithm = "insight_face", npz_key = "bbox_2d" }
[algorithms.spiga.required_assets]
model_weights_path = "<assets>/spiga/spiga_wflw.pt" # path to weights folder


# ======================================================================
#                        MediaPipe Face Landmarker
# ======================================================================

[algorithms.mediapipe_face_landmarks]
algorithm_type = "mediapipe_face_landmarks"
env_name = "mediapipe"
camera_names = ["view_left", "view_right"]
keypoint_mapping = "mediapipe_face"
visualize = true
visualize_native = false
visualize_keypoints_npz_key = "2d_interpolated"
num_faces = 10
min_face_detection_confidence = 0.5
min_face_presence_confidence = 0.5
min_face_tracking_confidence = 0.5
filter_keypoints = {filtered = true, window_length = 11, polyorder = 2 }
interpolate_keypoints = {interpolated = true, max_gap = 10 }
[algorithms.mediapipe_face_landmarks.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }
[algorithms.mediapipe_face_landmarks.required_assets]
model_path = "<assets>/mediapipe/face_landmarker.task"


# ======================================================================
#                        Emotions Detection Py-Feat
# ======================================================================

# emotion_individual
[algorithms.py_feat]
algorithm_type = "py_feat"
env_name = "py_feat"
camera_names = ["view_left", "view_right"]
# visualization
visualize = true
visualize_native = false  # run native Py-Feat visualize
visualize_native_barplots = false  # if visualize_native true, draw bar plots for AU and emotions
# inference settings
batch_size = 32
face_detection_threshold = 0.5  # RetinaFace detection confidence threshold; faces below this are dropped.
output_size = []  # Optional (width, height) to resize frames before detection. Empty = native resolution.
num_workers = 0  # CPU workers for the preprocessing DataLoader (0 = load in the main process).
save_face_mesh = false  # Keep the 3d face mesh?
hf_weights_cache_dir = "<assets>/py_feat"
[algorithms.py_feat.inputs]
subjects = { component = "subject_regions", algorithm = "video_subject_detector", npz_key = "regions" }
[algorithms.py_feat.required_assets]
multitask_model = "<assets>/py_feat/models--py-feat--face_multitask_v2"
face_detector_model = "<assets>/py_feat/models--py-feat--retinaface_r34"

# ======================================================================
#                      Audio Transcription WhisperX
# ======================================================================

[algorithms.whisperx]
algorithm_type = "whisperx"
track_names = "*"
fallback_camera = "view_center"
env_name = "whisperx"
model_size = "large-v3"
compute_type = "float16"
batch_size = 16
language = "en"
vad_onset = 0.9
vad_offset = 0.9
alignment_model_name = "WAV2VEC2_ASR_LARGE_LV60K_960H"
visualize = true
# Hugging Face / WhisperX model cache root (directory created at inference if missing).
hf_weights_cache_dir = "<assets>/whisperx"

[algorithms.whisperx.required_assets]
faster_whisper = "<assets>/whisperx/models--Systran--faster-whisper-large-v3"
pyannote_diarization = "<assets>/whisperx/models--pyannote--speaker-diarization-community-1"
alignment_model = "<assets>/whisperx/hub/checkpoints/wav2vec2_fairseq_large_lv60k_asr_ls960.pth"


[algorithms.crisper_whisper]
algorithm_type = "crisper_whisper"
track_names = "*"
fallback_camera = "view_center"
env_name = "crisper_whisper"
batch_size = 1
chunk_length_s = 30
stride_length_s = 5
visualize = true
hf_weights_cache_dir = "<assets>/crisper_whisper"

[algorithms.crisper_whisper.required_assets]
crisper_whisper = "<assets>/crisper_whisper/models--nyrahealth--CrisperWhisper"

# ======================================================================
#                      Eye Closure Detection (2D)
# ======================================================================

# detects how much subject closed their eyes using 2d facial landmarks
[algorithms.eye_closure_score_ear]
algorithm_type = "eye_closure_ear"
camera_names = ["view_left", "view_right"]  # use only face cameras
visualize = true
[algorithms.eye_closure_score_ear.inputs]
landmarks_2d = { component = "face_landmarks", algorithm = "spiga", npz_key = "2d" }

# same, but using mmpose 2d landmarks
[algorithms.eye_closure_score_ear_rtmpose]
algorithm_type = "eye_closure_ear"
camera_names = ["view_left", "view_right"]  # use only face cameras
visualize = true
[algorithms.eye_closure_score_ear_rtmpose.inputs]
landmarks_2d = { component = "face_landmarks", algorithm = "rtmw_l_wholebody", npz_key = "2d" }

# define that eye closed if aspect ration is less than threshold
[algorithms.eye_state_ear]
algorithm_type = "eye_closure_threshold"
camera_names = ["view_right", "view_left"]
visualize = true
threshold = 0.12  # max ratio for closed eye
[algorithms.eye_state_ear.inputs]
score = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "score" }
eye_landmarks_2d = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "eye_landmarks_2d" }

# calculate blinks
[algorithms.eye_blinks_state_ear]
algorithm_type = "eye_closure_threshold"
camera_names = ["view_right", "view_left"]
visualize = true
threshold = 0.12
# define min and max time for eye to be considered blinked
min_duration = 0.05
max_duration = 0.5
[algorithms.eye_blinks_state_ear.inputs]
score = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "score" }
eye_landmarks_2d = { component = "eye_closure_score", algorithm = "eye_closure_score_ear", npz_key = "eye_landmarks_2d" }

# ======================================================================
#                           Subject System
# ======================================================================

# Parameters for subjects identity system that assign all detectors predictions
# to a specific subject definition from dataset properties
[subject_assignment.video]
min_overlap = 0.35  # discard any detection with geometric score smaller than threshold
confidence_weight = 0.1  # how important confidence comparing to geometric score

# Service feature detector for video stream
[algorithms.video_subject_detector]
algorithm_type = "video_subject_detector"
visualize = true  # draw subject regions?