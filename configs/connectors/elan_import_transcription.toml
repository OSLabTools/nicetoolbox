dataset_folder = "<datasets_folder_path>/communication_multiview"
elan_import    = "<output_folder_path>/connectors/elan_import/transcription"

log_level = "INFO"
log_file_path = "<elan_import>/elan_import_transcription.log"
export_srt = true
export_csv = true

# Which parts of ELAN labels to take
import_segments = true
import_words = true

# Import the corrected speaker-aligned transcription
[run.sequenc]
input = "<dataset_folder>/annotations_raw/speaker_aligned_transcription_elan/sequence_xyz_transcription.txt"
output = "<elan_import>/sequence_xyz_speaker_aligned_transcription.json"
tracks = ["room"]
