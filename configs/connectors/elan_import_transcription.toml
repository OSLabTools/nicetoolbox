# Import annotator-corrected ELAN transcription labels back into NICE transcription JSON.
#
# Point `output` at the dataset annotation path to promote the result to ground truth

dataset_folder = "<datasets_folder_path>/communication_multiview"
elan_input     = "<output_folder_path>/connectors/elan_export"
elan_output    = "<output_folder_path>/connectors/elan_import"

log_level = "INFO"
log_file_path = "<elan_output>/elan_import_transcription.log"

[run.sequence_xyz]
input  = "<elan_input>/sequence_xyz_audio_transcription.txt"
output = "<elan_output>/sequence_xyz_audio_transcription.json"
start = 0
end = -1
