# Import annotator-corrected speaker-aligned transcription labels back into NICE JSON.
#
# Rebuilds segments + word_segments, with each word's speaker taken from the corrected speaker
# tier. Point `output` at the dataset annotation path to promote the result to ground truth

dataset_folder = "<datasets_folder_path>/communication_multiview"
elan_input     = "<output_folder_path>/connectors/elan_export"
elan_output    = "<output_folder_path>/connectors/elan_import"

log_level = "INFO"
log_file_path = "<elan_output>/elan_import_speaker_aligned_transcription.log"

[run.sequence_xyz]
input  = "<elan_input>/sequence_xyz_speaker_aligned_transcription.txt"
# input  = "<elan_input>/sequence_xyz_speaker_aligned_transcription_corrected.txt" -> point to corrected elan data
output = "<elan_output>/sequence_xyz_speaker_aligned_transcription.json"
# output = "<elan_output>/sequence_xyz_speaker_aligned_transcription_corrected.json" -> point to final annotation
start = 0
end = -1
