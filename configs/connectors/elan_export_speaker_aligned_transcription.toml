# Export speaker-aligned transcription output to ELAN, with word and speaker tiers enabled.
#
# Unlike the plain audio_transcription component, speaker_aligned_transcription carries a speaker
# label on every word, so annotators can correct diarization turns alongside the text.
#
# Tiers written per track: "<track>" (segments), "<track>__words", "<track>__speaker", and — for
# multi-speaker tracks (e.g. room) — one "<track>__<speaker>" segment tier per speaker

experiment     = "<output_folder_path>/experiments/20260623"
elan_output    = "<output_folder_path>/connectors/elan_export"

log_level = "INFO"
log_file_path = "<elan_output>/elan_export_speaker_aligned_transcription.log"

include_words = true
include_speaker = true
include_speaker_segments = true
# "dominant" keeps a mixed-speaker segment whole under its majority speaker; "split" divides it.
mixed_segment_strategy = "dominant"

[run.sequence_xyz]
input  = "<experiment>/communication_multiview__sequence_xyz_s0_l-1/speaker_aligned_transcription/whisperx.json"
output = "<elan_output>/sequence_xyz_speaker_aligned_transcription.txt"
start = 0
end = -1
