experiment_name = "<yyyymmdd>"
experiment     = "<output_folder_path>/experiments/<experiment_name>"
elan_output    = "<output_folder_path>/connectors/elan_export/transcription"

log_level = "INFO"
log_file_path = "<elan_output>/elan_export_transcription.log"

export_segments = true
export_words = true

# Export raw audio transcription output to ELAN
[run.whisperx]
subsequence_name = "communication_multiview_sequence_xyz_s0_l-1"
input  = "<experiment>/<subsequence_name>/audio_transcription/whisperx.json"
output = "<elan_output>/sequence_xyz_whisperx.txt"
tracks = ["left_mic", "right_mic"]  # take left and right audio tracks

# Export speaker-aligned transcription output to ELAN, with word and speaker tiers enabled.
[run.whisperx_aligned]
subsequence_name = "communication_multiview_sequence_xyz_s0_l-1"
input  = "<experiment>/<subsequence_name>/speaker_aligned_transcription/whisperx.json"
output = "<elan_output>/sequence_xyz_whisperx_aligned.txt"
tracks = ["room"]  # take only from two speakers track
