spawn_viewer = true                                                       # if true, will spawn window with GUI

[io]
dataset_folder = "<datasets_folder_path>"                                 # main dataset folder
dataset_name = 'communication_multiview'                                  # dataset of the video
video_name = 'communication_multiview_sequence_xyz_s0_l-1'                 # name of video result folder
nice_tool_input_folder = "<output_folder_path>/nicetoolbox_input/<cur_dataset_name>_<cur_sequence_id>" # raw_processed input data
nice_tool_output_folder = "<output_folder_path>/experiments"              # NICE Toolbox experiment output
experiment_folder = "<output_folder_path>/experiments/<yyyymmdd>"         # select single NICE Toolbox experiment output folder
experiment_video_folder = "<experiment_folder>/<video_name>"              # NICE Toolbox output folder for the specific video
experiment_video_component = "<experiment_video_folder>/<cur_component_name>" # NICE Toolbox output folder for the specific component

[media]                                                    # each Media session shows one video results.
[media.visualize]                                          # specify what will be visualized
components = ["body_joints", "hand_joints", "face_landmarks", "head_orientation", "gaze_multiview", "gaze_interaction", "emotion_individual", "kinematics", "proximity", "eye_closure_score", "eye_closed_state"]
start_frame = 0                                            # starting frame for the visualization
end_frame = -1                                             # end frame for the visualization, -1 means process until the end of the video
visualize_interval = 1                                     # 1 means visualize every frame; change the parameter accordingly if you want to visualize every x frames

###### Configuring Component Data Display in Rerun Windows #####
### You can control which data will be shown in specific rerun windows by adjusting the 'media.component.canvas' items
### The keys (like '3d' or '2d_interpolated') represent different type of data provided by that component.
### The value lists define which canvases (rerun windows) will show the data
### 1. '3D_Canvas': This shows data in the 3D canvas. It is only for multi-view datasets. (Do not change the canvas name).
### 2. Cameras: Data will be visualized on that specific camera image. The camera name must match the camera placeholder names in dataset_properties.toml
### 3. Metrics - The displays the data as plots.
### 4. Empty list: If you don't want the data to be visualized, leave the list empty.

### Configuring Algorithm Display
## Under 'media.component', the algorithms parameter let you choose which algorithms to display.
## For example, if you have multiple algorithms (e.g., hrnetw48 and vitpose in the body_joints component),
## you can specify which algorithm’s results to show.
## If you want to see results from both algorithms, list both names.

### Configuring Apearance
## Under 'media.component.appearance', you can configure the color and radii (the size of the dots and lines).

# Component: gaze fusion
# Each algorithm below is a gaze_fusion instance; the visualizer draws one arrow overlay
# per instance so different fusion strategies can be compared side-by-side. All arrays
# (fused 3D, per-camera 2D reprojection, 2D face origin) are read from each fusion NPZ.
# Look-at coloring (from gaze_interaction) only recolors the first algorithm's arrow.
[media.gaze_multiview]
algorithms = ['gaze_fusion_weighted']

[media.gaze_multiview.canvas]
# Canvas list controls which canvases receive the overlay; keys are informational.
# Both keys are declared because some fusion instances emit only gaze_3d (no _filtered).
gaze_3d = ["3D_Canvas", "view_left", "view_right", "view_top", "view_center"]
gaze_3d_filtered = ["3D_Canvas", "view_left", "view_right", "view_top", "view_center"]
## Note: Delete '3D_Canvas' if you don't have a multi-view setup.

[media.gaze_multiview.appearance]
colors = [[0, 150, 90], [200, 120, 40]]  # one color per algorithm above
radii = {'3d'= 0.01, 'camera_view'= 4}

# Component: gaze interaction
# Algorithms are paired positionally with [media.gaze_fusion].algorithms:
# gaze_distance_3d          <-> gaze_fusion_weighted
# gaze_distance_3d_per_subject <-> gaze_fusion_per_subject
# The two lists MUST have the same length; each pair recolors the corresponding fusion arrow.
[media.gaze_interaction]
algorithms = ['gaze_distance_3d']

[media.gaze_interaction.canvas]
gaze_look_at_3d = ["3D_Canvas", "view_left", "view_right"] ## value options: [3D_Canvas], [3D_Canvas, camera names], [camera names], []
#gaze_look_at_2d = ["view_center"]                            ## use data key gaze_look_at_2d if you don't have a multi-view setup.

[media.gaze_interaction.appearance]
# One [looking-at, not-looking-at] color pair per algorithm above.
colors = [
    [[0,255, 0], [255, 0, 0]],   # gaze_distance_3d: green / red
    [[0,255, 0], [255, 0, 0]],   # gaze_distance_3d: green / red
]
radii = {}


# Component: body joints
[media.body_joints]
algorithms = ['vitpose_huge', 'hrnetw48']

[media.body_joints.canvas]
3d = ["3D_Canvas"] ## value options: 3D_Canvas, [] -- Note: set as [] if you don't have a multi-view setup.
2d_interpolated = ["view_top", "view_center"]  ##key options: 2d, 2d_interpolated, 2d_filtered ##value options: [camera names]

[media.body_joints.appearance]
colors = [[0, 191, 255], [200, 200, 200]]
radii = {'3d'= 0.01, 'camera_view'= 4}

# Component: hand joints
[media.hand_joints]
algorithms = ['hrnetw48']

[media.hand_joints.canvas]
3d = ["3D_Canvas"] ## value options: 3D_Canvas, [] -- Note: set as [] if you don't have a multi-view setup.
2d_interpolated = ["view_top", "view_center"]  ##key options: 2d, 2d_interpolated, 2d_filtered ##value options: [camera names]

[media.hand_joints.appearance]
colors = [[255, 69, 0]]  # orange #alternative 255, 165, 0
radii = {'3d'= 0.006, 'camera_view'= 2}


# Component: face landmarks
[media.face_landmarks]
algorithms = ['hrnetw48']

[media.face_landmarks.canvas]
3d = ["3D_Canvas"] ## value options: 3D_Canvas, [] -- Note: set as [] if you don't have a multi-view setup.
2d_interpolated = ["view_top", "view_center"]  ##key options: 2d, 2d_interpolated, 2d_filtered ##value options: [camera names]

[media.face_landmarks.appearance]
colors =  [[170,171,69]] #[255,255,4] yellow =- green j. [77, 188, 139]
radii = {'3d'= 0.01, 'camera_view'= 4}


# Component: emotion_individual
[media.emotion_individual]
algorithms = ['py_feat']

[media.emotion_individual.canvas]
emotions = ["view_left", "view_right"]  ##value options: [camera names]

[media.emotion_individual.appearance]
colors =  [[[255,0,0], [85,170,47], [72,61,139], [255,215,0], [70,130,180], [255,140,0], [128, 128, 128]]] #red, dark olive green, dark stale blue, gold, steel blue, dark orange, gray  
radii = {'3d'= 0.01, 'camera_view'= 4}

# Component: head orientation
[media.head_orientation]
algorithms = ['spiga']

[media.head_orientation.canvas]
head_orientation_2d = ["view_center", "view_top", "view_left", "view_right"]  ##value options: [camera names]

[media.head_orientation.appearance]
colors =  [[[255,92,0], [85,170,47]]] #neon orange, dark olive green
radii = {'3d'= 0.01, 'camera_view'= 4}

# Component: kinematics
# Reads per-bodypart velocity produced by velocity_body. Bodypart groupings are declared
# by the upstream keypoint mapping (predictions_mapping.toml), not here.
[media.kinematics]
algorithms = ['velocity_body_3d']  # or 'velocity_body_2d' for single-view setups

[media.kinematics.canvas]
velocity_bodypart_3d = ["metric_velocity"]
velocity_bodypart_2d = ["metric_velocity"]


# Component: eye closure (EAR)
# Draws a contour around each eye. The eye points are read from the component NPZ, so the
# canvas cameras must be a subset of the cameras the eye_closure_ear instance was run on
# (see its camera_names in detectors_config).
[media.eye_closure_score]
algorithms = ['eye_closure_ear']

[media.eye_closure_score.canvas]
eye_landmarks_2d = ["view_left", "view_right"]  ## value options: [camera names]
score = ["metric_eye_closure"]  ## EAR score plotted per tracked subject/camera; [] to disable

[media.eye_closure_score.appearance]
# Fallback colors, one per algorithm above. Used when eye_closed_state is not visualized.
colors = [[0, 255, 255], [255, 0, 255]]
radii = {'3d'= 0.01, 'camera_view'= 1}

# Component: eye closed state
# Algorithms are paired positionally with [media.eye_closure_score].algorithms:
# eye_closed_ear  <-> eye_closure_ear
# The two lists MUST have the same length; each pair recolors the corresponding eye contours
# closed/open. Drop 'eye_closed_state' from media.visualize.components to fall back to the
# static eye_closure_score colors.
[media.eye_closed_state]
algorithms = ['eye_closed_ear']

[media.eye_closed_state.canvas]
state = []

[media.eye_closed_state.appearance]
# One [closed, open] color pair per algorithm above.
colors = [
    [[255, 0, 0], [0, 255, 0]],   # eye_closed_ear: red when closed / green when open
]
radii = {}


# Component: proximity
[media.proximity]
algorithms = ['body_distance_2d']

[media.proximity.canvas]
body_distance_3d = ["3D_Canvas"] ## value options: 3D_Canvas, [] -- Note: set as [] if you don't have a multi-view setup.
body_distance_2d = ["view_top", "view_center"] ## value options: [camera nanes]

[media.proximity.appearance]
colors = [[153,50,204]]
radii = {'3d'= 0.008, 'camera_view'= 3}
